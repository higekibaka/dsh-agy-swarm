name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Offline check and tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.19 对齐 package.json 的 engines.node（^22.19.0）：Node 22.13 之前不认 `--test-isolation`，
        # 会以 exit code 9（Invalid Argument）把 CI 直接打挂。
        node: ['22.19', '24']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: npm run check

      - name: Offline test suite
        # Linux / macOS 没有 Windows 沙盒的命名管道限制，套件之间无需共享进程隔离。
        run: npm run test:ci

      - name: Package preview
        run: npm pack --dry-run
